name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The wire types must match orbyn-engine's main branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kinqsradio/orbyn-engine
          path: engine
          persist-credentials: false
      - run: npm run generate:check
        env:
          ORBYN_ENGINE_DIR: ${{ github.workspace }}/engine
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The committed WebAssembly package must be what the pinned orbyn-engine commit builds on Linux, with the pinned toolchain.
  wasm:
    name: Wasm package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The engine commit the package was built from: updating it is a deliberate `npm run wasm` and a commit.
      - id: pin
        run: echo "engine=$(node -p "require('./src/generated/wasm/manifest.json').engine")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kinqsradio/orbyn-engine
          ref: ${{ steps.pin.outputs.engine }}
          path: engine
          persist-credentials: false
      # The versions in web/wasm.lock.json: change them together.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-bindgen@0.2.130
      # Exactly the pinned commit, with nothing changed: the check is byte for byte.
      - name: The engine checkout is clean and at the pin
        working-directory: engine
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.engine }}"
          test -z "$(git status --porcelain)"
      - run: npm run wasm:check
        env:
          ORBYN_ENGINE_DIR: ${{ github.workspace }}/engine

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit
      - name: Cargo audit
        working-directory: desktop/src-tauri
        run: cargo audit
      - name: Cargo check and test
        working-directory: desktop/src-tauri
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          cargo clippy --locked -- -D warnings
          cargo test --locked

