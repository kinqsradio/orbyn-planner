[package]
name = "orbyn-planner-desktop"
version = "0.1.0"
description = "The desktop shell of Orbyn Planner: a window around the web build."
edition = "2024"
rust-version = "1.90"
publish = false

# Its own workspace: nothing else builds this, and it builds nothing else.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
